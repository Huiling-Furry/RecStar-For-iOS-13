name: Build iOS 13 Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      ios_deployment_target:
        description: "iOS deployment target"
        required: true
        default: "13.0"

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          selected=""
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              selected="/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::Xcode 16.x was not found on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native toolchain downloads are ~1GB and are NOT covered by the
      # Gradle cache. Caching them removes several minutes from every rerun.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Xcode intermediate build products. Makes re-archiving much faster.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj', 'iosApp/iosApp/*.swift', 'iosApp/iosApp/Info.plist') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Check dependency lockfiles
        run: |
          set -euo pipefail
          find . -name gradle.lockfile -not -path './.gradle/*' -print | sort

      - name: Compile iOS Kotlin framework
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
        run: |
          set -euo pipefail
          ./gradlew :shared:compileKotlinIosArm64 -Dos.name="Mac OS X"

      - name: Archive unsigned app
        working-directory: iosApp
        env:
          TARGET: ${{ inputs.ios_deployment_target || '13.0' }}
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == "13.0" ]] || { echo "::error::This workflow is locked to iOS 13.0"; exit 1; }
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/RecStar-unsigned.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET="$TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -quiet

      - name: Validate unsigned archive
        working-directory: iosApp
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RecStar-unsigned.xcarchive/Products/Applications/RecStar.app"
          INFO="$APP/Info.plist"
          BINARY="$APP/RecStar"
          test -d "$APP"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          VERSION_CODE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          EXPECTED_VERSION="$(awk -F= '/^app.versionName=/ {print $2}' ../gradle.properties)"
          EXPECTED_VERSION_CODE="$(awk -F= '/^app.versionCode=/ {print $2}' ../gradle.properties)"
          [[ "$MIN_OS" == "13.0" ]] || { echo "::error::MinimumOSVersion is $MIN_OS"; exit 1; }
          [[ "$BUNDLE_ID" == "com.sdercolin.recstar" ]] || { echo "::error::Unexpected unsigned Bundle ID: $BUNDLE_ID"; exit 1; }
          [[ "$VERSION" == "$EXPECTED_VERSION" ]] || { echo "::error::Unexpected app version: $VERSION"; exit 1; }
          [[ "$VERSION_CODE" == "$EXPECTED_VERSION_CODE" ]] || { echo "::error::Unexpected app version code: $VERSION_CODE"; exit 1; }
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "::error::Unsigned archive unexpectedly contains a provisioning profile"
            exit 1
          fi
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "::error::Unsigned archive unexpectedly has a valid code signature"
            exit 1
          fi
          LINKED_FRAMEWORKS="$(otool -L "$BINARY")"
          printf '%s\n' "$LINKED_FRAMEWORKS"
          # Only frameworks introduced AFTER iOS 13 are a problem, and only when
          # they are NOT weakly linked. Xcode marks frameworks newer than the
          # deployment target as weak, and the Swift toolchain always injects
          # libswift*.dylib support libraries as weak too, so both are safe on
          # iOS 13. SwiftUI itself shipped with iOS 13 and is therefore allowed.
          IOS14_FRAMEWORKS="UniformTypeIdentifiers|WidgetKit|AppIntents|ActivityKit|Charts|SwiftData|Translation|Observation|MusicKit|NearbyInteraction"
          HARD_LINKED="$(printf '%s\n' "$LINKED_FRAMEWORKS" | grep -E "($IOS14_FRAMEWORKS)\.framework" | grep -v "weak" || true)"
          if [ -n "$HARD_LINKED" ]; then
            echo "::error::An iOS 14+ framework is linked without weak linking:"
            printf '%s\n' "$HARD_LINKED"
            exit 1
          fi
          vtool -show-build "$BINARY" || true
          MINOS="$(vtool -show-build "$BINARY" 2>/dev/null | awk '/minos/ {print $2}' | head -1)"
          echo "Binary minos: ${MINOS:-unknown}"
          if [ -n "$MINOS" ] && [ "$MINOS" != "13.0" ]; then
            echo "::error::Binary minos is $MINOS, expected 13.0"
            exit 1
          fi
          echo "Unsigned archive validated for iOS 13; Compose/Skiko still requires device runtime testing."

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/RecStar-unsigned.xcarchive/Products/Applications/RecStar.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          zip -qry "$GITHUB_WORKSPACE/ci-artifacts/RecStar-iOS13-unsigned.ipa" Payload
          cp "$GITHUB_WORKSPACE/ci/i4-signing-guide.txt" "$GITHUB_WORKSPACE/ci-artifacts/i4-signing-guide.txt"
          ls -lh "$GITHUB_WORKSPACE/ci-artifacts"

      - name: Upload unsigned IPA and i4 guide
        uses: actions/upload-artifact@v4
        with:
          name: RecStar-iOS13-unsigned-ipa
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 30
